<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bonsai Cup 2026 – Live</title>
<style>
/* ============================================================
   KONFIGURATION  →  siehe <script> ganz unten (SHEET)
   ============================================================ */
/* Vereinsfarben SV Saaldorf 1965 e.V.: Rot · Weiß · Schwarz
   --acc  = Akzentrot für Text/Icons (kontraststark auf Weiß)
   --red  = Rot für Flächen (Kopf, Chips, Buttons)          */
:root{
  --bg:#f4f4f6; --card:#ffffff; --line:#e2e2e6; --line2:#eeeef1;
  --tx:#121214; --tx2:#5b5b62; --tx3:#8b8b93;
  --acc:#8f1015; --acc-s:#fbeced;
  --red:#a4161a; --red-d:#7d0f13;
  --ink:#1c1c1e; --ink-s:#ececef;
  --live:#a4161a; --gold:#a4161a; --silver:#1c1c1e; --bronze:#9a9aa2;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111112; --card:#1a1a1d; --line:#2f2f33; --line2:#26262a;
    --tx:#f0f0f2; --tx2:#a9a9b0; --tx3:#7d7d85;
    --acc:#ff8a86; --acc-s:#341416;
    --red:#8f1015; --red-d:#6d0d11;
    --ink:#e8e8ea; --ink-s:#2b2b30;
    --live:#ff7a76; --gold:#8f1015; --silver:#6f6f78; --bronze:#4c4c54;
    --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}

/* ---------- Kopf ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--red);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 0 0;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
  border-bottom:3px solid #121214;
}
@media (prefers-color-scheme:dark){header{background:#7d0f13;border-bottom-color:#000}}
.hrow{display:flex;align-items:center;gap:11px;padding:2px 0 10px}
.logo{
  flex:none;width:44px;height:44px;border-radius:11px;background:#fff;
  padding:3px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.28);
}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:12px;opacity:.9;margin-top:1px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);flex:none}
.dot.on{background:#fff;animation:pulse 1.8s infinite}
.dot.err{background:#121214;animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.iconbtn{
  flex:none;width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;
  background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:17px;
}
.iconbtn:active{background:rgba(255,255,255,.3)}
.iconbtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Tabs ---------- */
nav{display:flex;gap:4px;padding:0 0 8px}
nav button{
  flex:1;border:0;cursor:pointer;padding:9px 4px;border-radius:10px 10px 0 0;
  background:transparent;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:600;
  font-family:inherit;position:relative;
}
nav button{color:rgba(255,255,255,.8)}
nav button.act{background:var(--bg);color:var(--tx)}

/* ---------- Filterleiste ---------- */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px;margin:0 -12px;
  padding-left:12px;padding-right:12px;border-bottom:1px solid var(--line)}
.tools.stuck{box-shadow:0 4px 10px rgba(0,0,0,.06)}
.search{position:relative;margin-bottom:8px}
.search input{
  width:100%;padding:11px 38px 11px 36px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:16px;font-family:inherit;
}
.search input:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--tx3);font-size:20px;cursor:pointer;padding:4px 8px;display:none;font-family:inherit}
.search.has .clr{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.chip.act{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-color-scheme:dark){.chip.act{color:#fff}}

/* ---------- Statuskarte ---------- */
.status{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:12px 14px;margin:12px 0;display:flex;align-items:center;gap:12px;
}
.status .txt{flex:1;min-width:0}
.status .big{font-size:14px;font-weight:700}
.status .small{font-size:12.5px;color:var(--tx2);margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.jump{flex:none;border:0;background:var(--acc-s);color:var(--acc);font-weight:700;font-size:12.5px;
  padding:9px 12px;border-radius:10px;cursor:pointer;font-family:inherit}

/* ---------- Zeitblöcke & Spiele ---------- */
.slot{margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.slot .t{font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--tx2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.slot .l{flex:1;height:1px;background:var(--line)}
.slot .tag{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--live);color:#fff}
@media (prefers-color-scheme:dark){.slot .tag{color:#2a0000}}
.slot .tag.done{background:var(--line);color:var(--tx3)}
/* §6.1: der Verzug, nur wenn es einen gibt */
.slot .dl{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  padding:3px 8px;border-radius:999px;background:var(--acc-s);color:var(--acc);white-space:nowrap}
.slot .dl.early{background:var(--ink-s);color:var(--tx2)}
.slot .rn{flex:none;font-size:11px;font-weight:700;color:var(--tx3);white-space:nowrap}

.pause{
  margin:14px 0;padding:10px 13px;border-radius:12px;border:1px dashed var(--line);
  background:transparent;color:var(--tx2);font-size:13px;display:flex;gap:9px;align-items:center;
}

.m{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  margin-bottom:8px;overflow:hidden;
}
.m.now{border-color:var(--live);border-left:4px solid var(--live)}
.m.done{opacity:.97}
/* §9.1: ein laufendes Spiel sieht anders aus als ein offenes */
.m.live{border-color:var(--live);border-left:4px solid var(--live);
  box-shadow:0 1px 2px rgba(0,0,0,.07),0 4px 14px rgba(164,22,26,.16)}
.mh .run{flex:none;display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--live);color:#fff}
@media (prefers-color-scheme:dark){.mh .run{color:#2a0000}}
.mh .run::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:pulse 1.8s infinite}
.mh{display:flex;align-items:center;gap:7px;padding:8px 12px 6px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
.nr{font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums}
.pl{font-weight:700;background:var(--ink-s);color:var(--ink);padding:2px 8px;border-radius:6px}
.rd{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rd.ko{color:var(--ink);font-weight:800}
.mb{padding:2px 12px 11px}
.side{display:flex;align-items:center;gap:10px;padding:5px 0}
.side + .side{border-top:1px solid var(--line2)}
.code{flex:none;width:34px;font-size:10.5px;font-weight:800;color:var(--tx3);letter-spacing:.3px}
.nm{flex:1;min-width:0;font-size:15px;line-height:1.3}
.nm .plc{color:var(--tx3);font-style:italic;font-size:13.5px}
.sc{flex:none;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx3);min-width:26px;text-align:right}
.side.w .nm{font-weight:800}
.side.w .sc{color:var(--acc)}
.side.l .nm,.side.l .sc{color:var(--tx2)}
.m.pending .sc{color:var(--tx3);font-weight:600;font-size:16px}
mark{background:#f7d3d4;color:#121214;border-radius:3px;padding:0 1px;font-weight:700}
@media (prefers-color-scheme:dark){mark{background:#6d1417;color:#fff}}

/* ---------- Gruppen ---------- */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  margin:12px 0;overflow:hidden}
.gcard h2{margin:0;padding:12px 14px 10px;font-size:15px;font-weight:800;border-bottom:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:700;
  padding:7px 3px;text-align:center;border-bottom:1px solid var(--line2)}
th:nth-child(2){text-align:left;padding-left:8px}
td{padding:9px 3px;text-align:center;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
td:nth-child(2){text-align:left;padding-left:8px;font-size:14px;line-height:1.25}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{padding-right:12px}
.rk{font-weight:800;color:var(--tx3);width:26px}
tr.q .rk{color:var(--acc)}
tr.q td:nth-child(2){font-weight:700}
tr.q{background:var(--acc-s)}
.pts{font-weight:800}
.gcard .hint{padding:9px 14px;font-size:11.5px;color:var(--tx3);border-top:1px solid var(--line2)}

/* ---------- Platzierung ---------- */
.pl-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh);padding:10px 13px;margin-bottom:6px}
.pl-row .p{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--line2);color:var(--tx2);font-variant-numeric:tabular-nums}
.pl-row.m1 .p{background:var(--gold);color:#fff}
.pl-row.m2 .p{background:var(--silver);color:#fff}
.pl-row.m3 .p{background:var(--bronze);color:#121214}
.pl-row.m1{border-color:var(--red)}
.pl-row .n{flex:1;min-width:0;font-size:15px}
.pl-row .n .o{font-size:11.5px;color:var(--tx3);margin-top:1px}
.pl-row .n .open{color:var(--tx3);font-style:italic}
.pl-row .g{flex:none;font-size:11px;font-weight:800;color:var(--tx3);background:var(--line2);
  padding:3px 8px;border-radius:6px}

/* ---------- Diverses ---------- */
.empty{text-align:center;color:var(--tx3);padding:40px 20px;font-size:14px}
.banner{background:var(--acc-s);color:var(--acc);border:1px solid var(--acc);border-radius:12px;
  padding:11px 13px;font-size:13px;margin:12px 0;display:flex;gap:9px;align-items:flex-start}
.setup{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px;margin:18px 0}
.setup h2{margin:0 0 8px;font-size:17px}
.setup p,.setup li{font-size:14px;color:var(--tx2);line-height:1.55}
.setup ol{padding-left:20px;margin:10px 0}
.setup input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;margin-top:6px}
.setup button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;background:var(--red);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
code{background:var(--line2);padding:1px 5px;border-radius:5px;font-size:12.5px}
footer{text-align:center;color:var(--tx3);font-size:11.5px;padding:26px 0 10px;line-height:1.7}
.skel{background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));background-size:200% 100%;
  animation:sk 1.3s infinite;border-radius:var(--r);height:74px;margin-bottom:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
[hidden]{display:none!important}
</style>
</head>

 * Both modules are tested for by name rather than as window properties: a
 * top-level `const` in a classic <script> is script-scoped and never lands on
 * window, so `window.TournamentEngine` would always be undefined.
 */
const E = typeof TournamentEngine !== "undefined" ? TournamentEngine : null;
const V = typeof TournamentViewer !== "undefined" ? TournamentViewer : null;

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const src = new URLSearchParams(location.search).get("id") || SHEET;
/* Leer, bis geladen wird — nicht V.parseWeb(""), damit die Seite auch dann
   noch etwas anzeigen kann, wenn viewer.js gar nicht da ist. */
let D = {title:"", logo:"", config:{start:"",matchMin:0,semiMin:0,finalMode:"",breaks:[]},
         matches:[], groups:{}, ranks:[]};
let filter = "jetzt", query = "", view = "spiele", loaded = false, busy = false;

/* ---------- Datenquelle ---------- */
function url(){
  if(/^https?:\/\//.test(src)) return src;
  return `https://docs.google.com/spreadsheets/d/${src}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(TAB)}`;
}

/* ---------- Laden ---------- */
async function load(manual){
  if(!src){ showSetup(); return; }
  if(busy) return; busy=true;
  const btn=$("#rf"); btn.classList.add("spin");
  try{
    const res=await fetch(url(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt=await res.text();
    if(/^\s*</.test(txt) || /google\.visualization\.Query/.test(txt))
      throw new Error("Die Tabelle ist nicht öffentlich freigegeben.");
    const d=V.parseWeb(txt);
    if(!d.matches.length) throw new Error("Im Blatt „"+TAB+"“ wurden keine Spiele gefunden.");
    D=d; loaded=true; render(); ok();
  }catch(e){
    if(loaded) warn(e.message); else showError(e.message);
  }finally{ busy=false; setTimeout(()=>btn.classList.remove("spin"),400); }
}
function now(){ return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function ok(){
  const s=V.summary(D);
  /* A court actually running is the strongest signal; otherwise "started but
     not finished" is enough to call the page live. */
  const live=s.playing>0 || (s.done>0 && s.current);
  $("#dot").className="dot"+(live?" on":"");
  $("#stat").textContent=(live?"Live · ":"")+"Stand "+now();
  if(D.title) $("#ttl").textContent=D.title;
}
function warn(msg){ $("#dot").className="dot err"; $("#stat").textContent="Offline – Stand "+now(); console.warn(msg); }

/* ---------- Ableitungen ---------- */

/** §6.1's drift, as the "+2 Min" the round header and the status card show. */
function drift(delta){
  if(!delta) return "";
  return (delta>0?"+":"−")+Math.abs(delta)+" Min";
}

function hl(s,q){
  const e=esc(s);
  if(!q) return e;
  const i=e.toLowerCase().indexOf(q);
  return i<0 ? e : e.slice(0,i)+"<mark>"+e.slice(i,i+q.length)+"</mark>"+e.slice(i+q.length);
}

/* ---------- Rendern ---------- */
function render(){ renderStatus(); renderList(); renderGroups(); renderRanks(); }

function renderStatus(){
  const s=V.summary(D);
  const cur=s.current;
  const time=cur?E.hhmm(cur.start):"";
  const late=cur?drift(cur.delta):"";
  let big, small;

  if(!s.total){ big="Keine Spiele"; small=""; }
  else if(!cur){ big="Turnier beendet"; small="Alle "+s.total+" Spiele gespielt"; }
  else if(s.done===0){
    big=time?"Turnier startet um "+time+" Uhr":"Turnier startet";
    small=s.total+" Spiele in "+s.rounds+" Runden";
  } else {
    /* §6.1: the live start, and the drift only when there is any. */
    big="Jetzt: Runde "+cur.round+(time?" · "+time+" Uhr":"")+(late?" · "+late:"");
    small=s.done+" von "+s.total+" Spielen gespielt";
  }
  if(cur && s.playing) small+=" · "+s.playing+(s.playing===1?" Spiel läuft":" Spiele laufen");

  $("#status").innerHTML=`<div class="status">
    <div class="txt"><div class="big">${esc(big)}</div>${small?`<div class="small">${esc(small)}</div>`:""}
      <div class="bar"><i style="width:${s.total?Math.round(s.done/s.total*100):0}%"></i></div></div>
    ${cur?`<button class="jump" id="jmp">Zu den<br>Spielen</button>`:""}
  </div>`;
  const j=$("#jmp");
  if(j) j.onclick=()=>{
    if(filter!=="jetzt"&&filter!=="alle"){ setFilter("jetzt"); }
    setTimeout(()=>{ const el=document.querySelector(".slot.now"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },60);
  };
}

function renderList(){
  const q=query.trim().toLowerCase();
  const f = (q && filter==="jetzt") ? "alle" : filter;   // Suche zeigt immer alle Spiele des Teams
  const cur=V.summary(D).current;
  const from=cur?cur.round:0;          // 0 = nichts mehr offen, „Live“ zeigt alles
  let html="", shown=0, seen=0;        // seen = letzte gezeichnete Runde, für die Pausen

  for(const b of V.blocks(D)){
    if(b.kind==="break"){
      if(q||f==="fertig"||f==="gruppe"||f==="endrunde") continue;
      if(f==="jetzt" && seen<from) continue;
      const when=b.from?`${esc(b.from)}–${esc(b.to)} · `:"";
      html+=`<div class="pause"><span>⏸</span><span>${when}${esc(b.label)} (${b.min} Min)</span></div>`;
      continue;
    }

    seen=b.round;
    if(f==="jetzt" && b.round<from) continue;

    let items=b.items.filter(m=>V.hit(D.matches,m,q));
    if(f==="gruppe")   items=items.filter(m=>m.phase==="Gruppe");
    if(f==="endrunde") items=items.filter(m=>m.phase!=="Gruppe");
    if(f==="fertig")   items=items.filter(V.isDone);
    if(!items.length) continue;

    const late=drift(b.delta);
    html+=`<div class="slot ${b.state}">
      <span class="t">${b.time?esc(b.time)+" Uhr":"Runde "+b.round}</span>
      ${b.state==="now"?'<span class="tag">Jetzt</span>':""}
      ${b.state==="done"?'<span class="tag done">Gespielt</span>':""}
      ${late?`<span class="dl ${b.delta>0?"late":"early"}">${esc(late)}</span>`:""}
      <span class="l"></span>
      <span class="rn">Runde ${b.round}</span></div>`;
    for(const m of items){ html+=card(m,b.state,q); shown++; }
  }

  $("#list").innerHTML = shown ? html :
    `<div class="empty">${q?`Keine Spiele für „${esc(query)}“ gefunden.`:"Für diesen Filter gibt es keine Spiele."}</div>`;
}

/**
 * One match. §9.1 asks for `playing` to read differently from `open`, so a
 * running court carries its own badge rather than only inheriting the accent of
 * the round it sits in — on a late day the two are not the same thing.
 */
function card(m,state,q){
  const done=V.isDone(m), playing=V.isPlaying(m);
  const draw=done&&m.sa===m.sb;
  const ko=m.phase!=="Gruppe";
  const cls=done?"done":playing?"live":"pending";

  const side=(ref,team,code,pts,other)=>{
    const s=V.slot(D.matches,ref,team);
    const win=done&&pts>other, lose=done&&pts<other;
    return `<div class="side ${win?"w":""}${lose?"l":""}">
      <span class="code">${esc(code||"")}</span>
      <span class="nm">${s.open?`<span class="plc">${hl(s.name,q)}</span>`:hl(s.name,q)}</span>
      <span class="sc">${pts==null?"–":pts}</span></div>`;
  };

  return `<article class="m ${cls} ${state==="now"&&!done?"now":""}">
    <div class="mh"><span class="nr">#${m.nr}</span><span class="pl">Platz ${esc(m.court)}</span>
      <span class="rd ${ko?"ko":""}">${hl(m.label,q)}</span>
      ${playing?'<span class="run">läuft</span>':""}${draw?'<span class="nr">unentsch.</span>':""}</div>
    <div class="mb">
      ${side(m.aRef,m.aTeam,m.aCode,m.sa,m.sb)}
      ${side(m.bRef,m.bTeam,m.bCode,m.sb,m.sa)}
    </div></article>`;
}

function renderGroups(){
  const ks=Object.keys(D.groups).sort();
  if(!ks.length){ $("#groups").innerHTML='<div class="empty">Noch keine Tabellen verfügbar.</div>'; return; }
  $("#groups").innerHTML = ks.map(k=>{
    const rows=D.groups[k].map(t=>`<tr class="${t.rank<=2?"q":""}">
        <td class="rk">${t.rank}</td>
        <td>${esc(t.team||t.code)}<div style="font-size:10.5px;color:var(--tx3);font-weight:600">${esc(t.code)}</div></td>
        <td>${t.sp}</td><td>${t.s}</td><td>${t.u}</td><td>${t.n}</td>
        <td>${(t.diff>0?"+":"")+t.diff}</td><td class="pts">${t.pkt}</td></tr>`).join("");
    return `<div class="gcard"><h2>Gruppe ${esc(k)}</h2>
      <table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Diff</th><th>Pkt</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="hint">Rot hinterlegt = Viertelfinale · Reihenfolge: Punkte → Differenz → Siege</div></div>`;
  }).join("");
}

function renderRanks(){
  if(!D.ranks.length){ $("#ranks").innerHTML='<div class="empty">Noch keine Platzierung.</div>'; return; }
  const any=D.ranks.some(r=>r.team);
  $("#ranks").innerHTML = (any?"":`<div class="banner"><span>ℹ️</span><span>Die Endplatzierung füllt sich, sobald die Endrunden-Spiele ausgetragen sind.</span></div>`)
   + D.ranks.map(r=>`<div class="pl-row ${r.place<=3?"m"+r.place:""}">
      <span class="p">${r.place}</span>
      <span class="n">${r.team?esc(r.team):`<span class="open">noch offen</span>`}<div class="o">${esc(r.origin)}</div></span>
      ${r.group?`<span class="g">${esc(r.group)}</span>`:""}
    </div>`).join("");
}

/* ---------- Einrichtung / Fehler ---------- */
function showSetup(msg){
  document.querySelectorAll("main section").forEach(s=>s.hidden=true);
  $("#nav").style.display="none";
  const s=$("#setup"); s.hidden=false;
  s.innerHTML=`<div class="setup">
    <h2>Seite einrichten</h2>
    ${msg?`<div class="banner"><span>⚠️</span><span>${esc(msg)}</span></div>`:""}
    <p>Die Seite liest die Ergebnisse live aus der Google-Tabelle des Turniers.</p>
    <ol>
      <li>Turnier-Excel in Google Drive öffnen → <b>Mit Google Tabellen öffnen</b> (einmalig speichern).</li>
      <li><b>Teilen → Allgemeiner Zugriff → Jeder mit dem Link · Betrachter</b>.</li>
      <li>Die ID aus der Adresszeile hier einfügen:</li>
    </ol>
    <p style="font-size:12.5px">docs.google.com/spreadsheets/d/<b>DIESE-ID</b>/edit</p>
    <input id="sid" placeholder="Tabellen-ID oder komplette CSV-URL" autocomplete="off">
    <button id="sgo">Spielplan laden</button>
    <p style="font-size:12px;margin-top:12px">Dauerhaft: die ID im Quelltext bei <code>const SHEET = ""</code> eintragen.</p>
    <p style="font-size:12px">Im selben Ordner müssen <code>engine.js</code> und <code>viewer.js</code> liegen.</p>
  </div>`;
  $("#sgo").onclick=()=>{
    const v=$("#sid").value.trim();
    if(!v) return;
    const m=v.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    location.search="?id="+encodeURIComponent(m?m[1]:v);
  };
  $("#sid").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#sgo").click(); });
}
function showError(msg){ showSetup(msg); }

/* ---------- Bedienung ---------- */
function setFilter(f){
  filter=f;
  document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("act",c.dataset.f===f));
  renderList();
}
$("#chips").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(c) setFilter(c.dataset.f); });
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  view=b.dataset.v;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("act",x===b));
  ["spiele","gruppen","platz"].forEach(v=>$("#v-"+v).hidden = v!==view);
  window.scrollTo({top:0});
});
let qt;
$("#q").addEventListener("input",e=>{
  query=e.target.value; $("#sw").classList.toggle("has",!!query);
  clearTimeout(qt); qt=setTimeout(renderList,120);
});
$("#qc").onclick=()=>{ $("#q").value=""; query=""; $("#sw").classList.remove("has"); renderList(); $("#q").focus(); };
$("#rf").onclick=()=>load(true);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
window.addEventListener("scroll",()=>{ const t=$("#tools"); if(t) t.classList.toggle("stuck",t.getBoundingClientRect().top<=1); },{passive:true});

/*
 * Der Viewer besteht aus drei Dateien. Fehlt eine, sagt die Seite das, statt
 * weiß zu bleiben: index.html wird herumkopiert, engine.js und viewer.js
 * werden dabei leicht vergessen.
 */
if(!E || !V){
  showError("engine.js und viewer.js müssen im selben Ordner wie index.html liegen.");
}else{
  load();
  setInterval(()=>{ if(!document.hidden) load(); },AUTO);
}
</script>
</body>
</html>
